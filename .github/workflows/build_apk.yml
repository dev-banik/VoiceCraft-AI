name: Build Android APK

on:
  push:
    # `branches` on its own means tag pushes never trigger this workflow,
    # which left the create-release-on-tag job below permanently unreachable.
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    env:
      # Read once at job level so the signing step can test for it. The
      # `secrets` context is not usable directly in a step-level `if`.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # This repo hand-authors the platform files that need real
      # customization (AndroidManifest.xml, settings.gradle.kts,
      # build.gradle.kts, app/build.gradle.kts, MainActivity.kt, Info.plist,
      # Podfile, ...) and deliberately omits the ones that are pure
      # generated boilerplate a human never edits — the Gradle wrapper
      # jar/scripts and the full ios/ Xcode project. `flutter create` only
      # writes files that don't already exist, so re-running it here safely
      # fills in exactly that missing boilerplate without touching anything
      # we committed. --project-name is required: without it, flutter
      # create derives the project name from the checkout directory
      # ("VoiceCraft-AI" — invalid, not lowercase_with_underscores) instead
      # of reading pubspec.yaml.
      #
      # settings.gradle.kts pins an explicit AGP/Kotlin version (see that
      # file's own header comment) rather than being left for flutter
      # create to generate: this SDK's default, AGP 9.0, hard-errors on the
      # classic Kotlin DSL syntax used elsewhere in this repo's Gradle
      # files, and AGP 9's replacement DSL isn't something to blind-migrate
      # to without documentation. If a `flutter create` platform-boilerplate
      # step ever fails here again, check whether this pin has drifted too
      # far behind the Flutter SDK in use.
      - name: Generate missing platform boilerplate
        run: flutter create --platforms=android,ios --project-name voicecraft_ai --org com.voicecraft .

      # `flutter create` derives its default MainActivity.kt package from
      # --org + the project name (com.voicecraft.voicecraft_ai), separate
      # from the applicationId "com.voicecraft.ai" this app actually uses
      # (set in android/app/build.gradle.kts, matching the committed
      # MainActivity.kt under .../kotlin/com/voicecraft/ai/). That leaves
      # an unused, unreferenced duplicate class at the org-derived path —
      # harmless to the build, but pointless to ship, so drop it.
      - name: Remove org-derived duplicate MainActivity
        run: rm -rf android/app/src/main/kotlin/com/voicecraft/voicecraft_ai

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis (non-blocking)
        run: flutter analyze || true

      - name: Run unit/widget tests
        run: flutter test

      # Without this every run signs with the runner's throwaway debug key,
      # so no two builds can ever upgrade each other on a device — installing
      # a new one means uninstalling the old and losing its recordings.
      - name: Set up release signing
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=voicecraft
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Warn when signing secrets are absent
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::KEYSTORE_BASE64 is not set — this APK is signed" \
               "with an ephemeral debug key and cannot upgrade an existing" \
               "install. See docs/SIGNING.md."

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Build universal debug APK (always installable, unsigned)
        run: flutter build apk --debug

      # if: success() || failure() on both upload steps below (not
      # always() — that would also fire on a cancelled run): a debug-build
      # hiccup must never throw away an already-successful release build.
      # Learned the hard way — an earlier debug-build failure here caused
      # GitHub Actions to skip the release-APK upload entirely, even though
      # the release build itself had already succeeded.
      - name: Upload release APKs
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: voicecraft-ai-release-apks
          path: build/app/outputs/flutter-apk/*release*.apk
          if-no-files-found: error

      - name: Upload debug APK
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: voicecraft-ai-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  create-release-on-tag:
    name: Attach APKs to GitHub Release
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing platform boilerplate
        run: flutter create --platforms=android,ios --project-name voicecraft_ai --org com.voicecraft .

      # `flutter create` derives its default MainActivity.kt package from
      # --org + the project name (com.voicecraft.voicecraft_ai), separate
      # from the applicationId "com.voicecraft.ai" this app actually uses
      # (set in android/app/build.gradle.kts, matching the committed
      # MainActivity.kt under .../kotlin/com/voicecraft/ai/). That leaves
      # an unused, unreferenced duplicate class at the org-derived path —
      # harmless to the build, but pointless to ship, so drop it.
      - name: Remove org-derived duplicate MainActivity
        run: rm -rf android/app/src/main/kotlin/com/voicecraft/voicecraft_ai

      - name: Install dependencies
        run: flutter pub get

      # Released APKs must carry the same signature as every other build,
      # otherwise downloading one means uninstalling first.
      - name: Set up release signing
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=voicecraft
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*release*.apk
          generate_release_notes: true
