org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false

# CI (see .github/workflows/build_apk.yml) runs `flutter build apk
# --release --split-per-abi` immediately followed by `flutter build apk
# --debug` in the same job. With the Gradle daemon left on, its JVM
# memory pressure from the first (3-way ABI split) build carried over into
# the second and hit "Java heap space" during a JetifyTransform — verified
# from an actual CI failure. Disabling the daemon means each `flutter
# build` invocation starts and releases a fresh JVM instead of reusing a
# potentially memory-pressured one; costs a bit of build speed, fixes the
# OOM.
org.gradle.daemon=false
