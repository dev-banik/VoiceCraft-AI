org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false

# AGP 9.0+ defaults to a new Kotlin DSL surface (ApplicationExtension
# instead of the classic `android { }`/`kotlinOptions { }` extension
# functions this project's android/app/build.gradle.kts uses) and hard-
# errors on the old one under that default. Opting out keeps the classic,
# widely-documented DSL working instead of chasing an AGP-version-specific
# migration here. See the CI build log / AGP's own deprecation message for
# where this flag name comes from if it needs revisiting.
android.newDsl=false
