name: voicecraft_ai
description: "VoiceCraft AI — professional voice recording, AI noise removal, voice transformation and cloud sync."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Local database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6

  # Audio recording / playback
  # Pinned to the 7.x line specifically: 5.x's floating sub-package
  # constraints let pub resolve record_platform_interface far ahead of
  # record_linux (interface added methods record_linux never implemented,
  # e.g. startStream), which broke compilation even for an Android-only
  # build since Flutter's kernel compile step type-checks the whole
  # dependency graph. 7.x publishes all record_* sub-packages as a
  # version-matched workspace, avoiding that whole class of bug.
  record: ^7.1.1
  just_audio: ^0.9.42
  audio_session: ^0.1.21
  audio_waveforms: ^1.2.0

  # Audio processing / editing (FFmpeg bundled binaries)
  ffmpeg_kit_flutter_new: ^1.6.0

  # Connectivity / background sync
  connectivity_plus: ^6.1.0
  workmanager: ^0.5.2

  # Permissions
  permission_handler: ^11.3.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  path: ^1.9.0
  equatable: ^2.0.7
  logger: ^2.5.0
  shared_preferences: ^2.3.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/models/
