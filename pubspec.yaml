name: voicecraft_ai
description: "VoiceCraft AI — professional voice recording, AI noise removal, voice transformation and cloud sync."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.6.2

  # Local database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6

  # Audio recording / playback
  record: ^5.2.0
  just_audio: ^0.9.42
  audio_session: ^0.1.21
  audio_waveforms: ^1.2.0

  # Audio processing / editing (FFmpeg bundled binaries)
  ffmpeg_kit_flutter_new: ^1.6.0

  # Connectivity / background sync
  connectivity_plus: ^6.1.0
  workmanager: ^0.5.2

  # Permissions
  permission_handler: ^11.3.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  path: ^1.9.0
  equatable: ^2.0.7
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  logger: ^2.5.0
  share_plus: ^10.1.3
  file_picker: ^8.1.4
  fl_chart: ^0.69.2
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.3
  crypto: ^3.0.6
  encrypt: ^5.0.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/models/
